# Actions are pinned to commit SHAs, and Maven plugins and libraries to exact versions in
# pom.xml, so none of them changes on its own. Dependabot proposes new versions as pull
# requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip versions released less than 7 days ago, so a compromised release
    # has a week to be found and pulled before it is proposed here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # Minor and patch updates share one pull request; each major update opens its own.
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      maven:
        update-types: [minor, patch]
