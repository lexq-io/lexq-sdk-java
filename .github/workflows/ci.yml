name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Specification copy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # No token left on disk: nothing in this job pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25

      - run: java scripts/CheckSpec.java

  # The check for the main branch's ruleset to require. It passes only when every job
  # in needs passed, so jobs can be added to needs without editing the ruleset.
  tests-passed:
    name: Tests passed
    needs: spec
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: test "$FAILED" = false
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
